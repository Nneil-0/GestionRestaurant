spring.application.name=restaurante-api
# =========================================================
# CONFIGURACI�N DE CONEXI�N A SQL SERVER
# =========================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BD_Restaurante;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sql
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =========================================================
# CONFIGURACI�N DE JPA / HIBERNATE
# =========================================================
# Importante: 'none' o 'validate' para garantizar que Hibernate
# NO modifique las tablas, triggers e �ndices creados en SSMS.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# =========================================================
# PUERTO DE EJECUCI�N LOCAL
# =========================================================
server.port=8080
# Mantiene los nombres exactos definidos en las anotaciones @Table y @Column (May�sculas/Min�sculas)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl